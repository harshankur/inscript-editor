name: Release

# Cut a release by tagging a commit vX.Y.Z (matching package.json's version)
# and pushing the tag:
#   npm version patch|minor|major   # bumps package.json, commits, and tags
#   git push --follow-tags          # pushes the commit AND the tag
#
# Pushing the v* tag triggers this workflow: it verifies the tag matches
# package.json and that the commit is on master, builds and tests, publishes to
# npm with provenance, then creates the GitHub Release. `workflow_dispatch` is
# also allowed, from master only, for a manual run against the current
# package.json version (it creates the matching tag if one does not exist yet).
#
# Three jobs, each with only what it needs. The build runs the whole toolchain
# (hundreds of dev dependencies) with a read-only token and no publishing rights;
# the publish job runs no project code (it publishes the tarball the build made,
# with scripts off) and holds only the OIDC token; only the last job can write to
# the repository, to tag and release. A compromised dev dependency can therefore
# neither publish nor push.
#
# Publish happens BEFORE the tag/release are created on a manual run, so a
# failed publish never leaves a dangling tag or GitHub Release behind. A version
# already on npm is refused up front, so re-runs never attempt a republish (npm
# version numbers can never be reused).

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions: {}

concurrency:
  # A published npm version can never be taken back — never let two releases race.
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # master's history, to check the commit is on it
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache in a release: a poisoned cache would reach what is published.
          package-manager-cache: false

      - name: Resolve and validate version
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # On a tag push, the pushed tag must match package.json's version,
          # otherwise we'd publish a version whose tag says something else.
          # A manual run releases only from master.
          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "$TAG" ]; then
              echo "::error::Pushed tag $REF_NAME does not match package.json version ($TAG). Bump package.json or retag."
              exit 1
            fi
          elif [ "$REF_NAME" != "master" ]; then
            echo "::error::A manual release runs from master only (not $REF_NAME)."
            exit 1
          fi

          # Only a commit on master is released (a tag on another branch's commit is refused).
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_SHA is not on master."
            exit 1
          fi

          # Refuse to re-release a version already on npm — the publish would
          # fail anyway, but failing here keeps the run clean and explicit.
          if npm view "inscript-editor@$VERSION" version >/dev/null 2>&1; then
            echo "::error::inscript-editor@$VERSION is already published to npm."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Test built output
        run: npm run test:dist

      # The package as published, built and tested by the steps above (npm pack runs
      # the prepack, prepare and pack scripts; this package has none).
      - name: Pack
        id: pack
        run: |
          TARBALL=$(npm pack --silent | tail -n 1)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Keep the tarball for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    # Protection rules (a required reviewer, tags only) can be set on this
    # environment in the repository's settings.
    environment: npm
    permissions:
      id-token: write   # npm Trusted Publishing (OIDC) and the provenance attestation
    steps:
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 ships npm >= 11.5.1, required for npm Trusted Publishing (OIDC).
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Fetch the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      # setup-node writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # into .npmrc whenever registry-url is set — even with NODE_AUTH_TOKEN unset,
      # leaving an EMPTY token line. npm reads that and concludes token auth is
      # configured, so it never starts the OIDC exchange and publish fails as
      # unauthenticated (actions/setup-node#1551). Stripping the line is what makes
      # Trusted Publishing actually engage.
      - name: Clear the empty auth token so OIDC can engage
        run: |
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$NPMRC" ]; then
            sed -i '/_authToken/d' "$NPMRC"
            echo "Stripped _authToken from $NPMRC"
          fi

      # Auth is npm Trusted Publishing (OIDC) — no NPM_TOKEN. The npm CLI detects
      # the OIDC environment and exchanges the GitHub id-token for a short-lived
      # registry credential. Configured at npmjs.com > inscript-editor > Settings >
      # Trusted Publisher, bound to this repo + workflow file. The tarball the build
      # job made is published as it is, with no scripts run.
      - name: Publish to npm
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "./$TARBALL" --provenance --access public --ignore-scripts

  release:
    name: Tag & GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the tag on manual runs, and create the GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history so --generate-notes has something to diff

      # Manual (workflow_dispatch) runs have no tag yet — create and push it only
      # after a successful publish. Tag-push runs already have the tag.
      - name: Create tag (manual runs only)
        if: github.ref_type != 'tag'
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
