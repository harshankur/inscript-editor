name: Publish to npm

# Publishes when a GitHub Release is published. Create a release for the tag
# matching the version in package.json (e.g. v0.1.0) and publishing it triggers
# this workflow.
on:
  release:
    types: [published]
  # Allow manual runs from the Actions tab — handy to re-run a publish that
  # failed midway without cutting a new release.
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance (publishConfig.provenance = true) to mint a
  # signed attestation via GitHub's OIDC token.
  id-token: write

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      # prepublishOnly (build + test) also runs on publish, but running them
      # explicitly here surfaces failures as distinct, readable CI steps.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
