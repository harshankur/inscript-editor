name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Read only: CI runs the whole toolchain, on pull requests too.
permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # `npm ci` installs from package-lock.json exactly and fails if the
      # lockfile is out of sync with package.json — this is what catches a
      # broken/mismatched dependency tree before it can ship.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Verifies the actual built dist (exports, styles extraction) — the same
      # thing a consumer installs — not just the source.
      - name: Test built output
        run: npm run test:dist
