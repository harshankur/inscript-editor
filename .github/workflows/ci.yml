name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` installs from package-lock.json exactly and fails if the
      # lockfile is out of sync with package.json — this is what catches a
      # broken/mismatched dependency tree before it can ship.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Verifies the actual built dist (exports, styles extraction) — the same
      # thing a consumer installs — not just the source.
      - name: Test built output
        run: npm run test:dist
